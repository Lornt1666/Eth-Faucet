name: Base Sepolia Faucet Claimer

on:
  schedule:
    # Run every 2 minutes
    - cron: '*/2 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  claim-faucet:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache claims history
        uses: actions/cache@v4
        with:
          path: claims_history.json
          key: claims-history-v1
          restore-keys: |
            claims-history-v1
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run faucet claimer (single mode)
        env:
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
          CLAIM_MODE: single
        run: |
          python claim.py
        timeout-minutes: 2
